<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёт физических лиц</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="icon" href="favicon icon.png" type="image/png">
</head>
<body>
    <!-- Контейнер для логотипа и кнопок -->
    <div class="header-container">
        <!-- Логотип -->
        <div class="logo">
            <img src="icons8-tax-office-64.png" alt="Логотип">
        </div>

        <!-- Кнопка "На главную" -->
        <div class="home-button">
            <!-- Кнопка "Вернуться на главную" -->
            <a href="index.html" class="return-button">Вернуться на главную</a>
        </div>

        <!-- Контейнер для кнопок -->
        <div class="button-container-top">
            <!-- Кнопка "Функции" с иконкой и вызовом функции goToFunctionsPage() -->
            <button onclick="goToFunctionsPage();"><i class="fas fa-cogs"></i> Функции</button>
            <button onclick="location.href='about.html';"><i class="fas fa-info-circle"></i> О нас</button>
            <button onclick="location.href='support.html';"><i class="fas fa-life-ring"></i> Тех.поддержка</button>
        </div>
    </div>

    <!-- Заголовок и кнопки управления -->
    <div class="column">
        <h1>Учёт физических лиц</h1>
        <button onclick="showAddPersonForm();"><i class="fas fa-user-plus"></i> Добавить новое лицо</button>
        <button onclick="saveAndUpdateData();"><i class="fas fa-save"></i> Сохранить данные</button>
        <!-- Форма для добавления нового лица -->
        <div id="addPersonForm" style="display: none;">
            <input type="text" id="newSurname" placeholder="Фамилия">
            <input type="text" id="newName" placeholder="Имя">
            <input type="text" id="newPatronymic" placeholder="Отчество">
            <input type="number" id="newAge" placeholder="Возраст">
            <input type="text" id="newInn" placeholder="ИНН">
            <button onclick="addNewPersonFromForm();">Добавить</button>
        </div>
    </div>

    <!-- Таблица для представления данных -->
    <div class="table-container">
        <table id="personsTable">
            <thead>
                <input type="text" id="searchInput" onkeyup="searchPerson()" placeholder="Поиск по имени...">
                <tr>
                    <th>Фамилия</th>
                    <th>Имя</th>
                    <th>Отчество</th>
                    <th>Возраст</th>
                    <th>ИНН</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Здесь могут добавляться строки с данными о лицах -->
            </tbody>
        </table>
    </div>

</body>
<footer>
    <div class="footer-links">
        <a href="privacy-policy.html">Политика конфиденциальности</a>
        <a href="terms-of-service.html">Условия использования</a>
        <a href="support.html" style="color: #007bff;">Связаться с нами</a>
    </div>
    <div class="footer-contact-info">
        <p><a href="tel:+123456789" style="color: #007bff;">Телефон: +123456789</a></p>
        <p><a href="mailto:example@example.com" style="color: #007bff;">Email: example@example.com</a></p>
    </div>
</footer>
<script>
    // Массив для хранения данных о лицах
    let persons = [];

    // Функция для добавления нового лица из формы
    function addNewPersonFromForm() {
        const newSurname = document.getElementById('newSurname').value;
        const newName = document.getElementById('newName').value;
        const newPatronymic = document.getElementById('newPatronymic').value;
        const newAge = document.getElementById('newAge').value;
        const newInn = document.getElementById('newInn').value;

        if (!newSurname || !newName || !newPatronymic || !newAge || !newInn) {
            alert("Все поля должны быть заполнены!");
            return;
        }

        const newPerson = {
            surname: newSurname,
            name: newName,
            patronymic: newPatronymic,
            age: newAge,
            inn: newInn
        };
        persons.push(newPerson);
        displayPersons();
        document.getElementById('addPersonForm').style.display = 'none';
    }

    // Функция для отображения формы добавления нового лица
    function showAddPersonForm() {
        document.getElementById('addPersonForm').style.display = 'block';
    }

    // Функция для сохранения и обновления данных
    function saveAndUpdateData() {
        localStorage.setItem('personsData', JSON.stringify(persons));
        alert("Данные сохранены и обновлены!");
    }

    // Функция для загрузки и отображения данных
    function displayPersons() {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';
        persons.forEach((person, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${person.surname}</td>
                <td>${person.name}</td>
                <td>${person.patronymic}</td>
                <td>${person.age}</td>
                <td>${person.inn}</td>
                <td><button onclick="viewPersonData(${index})">Просмотр</button> <button onclick="deletePerson(${index})">Удалить</button></td>
            `;
            tableBody.appendChild(row);
        });
    }

    // Функция для просмотра данных лица
    function viewPersonData(index) {
        const person = persons[index];
        alert(`Фамилия: ${person.surname}\nИмя: ${person.name}\nОтчество: ${person.patronymic}\nВозраст: ${person.age}\nИНН: ${person.inn}`);
    }

    // Функция для удаления лица
    function deletePerson(index) {
        persons.splice(index, 1);
        displayPersons();
        alert("Данные удалены!");
    }

    // Функция для поиска лиц
    function searchPerson() {
        const searchInput = document.getElementById('searchInput').value.toLowerCase();
        const filteredPersons = persons.filter(person =>
            person.name.toLowerCase().includes(searchInput) ||
            person.surname.toLowerCase().includes(searchInput)
        );
        displayPersons(filteredPersons);
    }

    // Загрузка данных при загрузке страницы
    window.onload = function() {
        if (localStorage.getItem('personsData')) {
            persons = JSON.parse(localStorage.getItem('personsData'));
            displayPersons();
        }
    };
</script>
</html>
